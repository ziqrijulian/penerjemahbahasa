<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penerjemah Bahasa</title>
<style>
:root{--bg:#f5f6fb;--surface:#fff;--ink:#1b1f3b;--muted:#6b7090;--line:#e2e5f1;--accent:#2563eb;--accent-ink:#fff;--bad:#e5484d}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e0f1f;--surface:#171932;--ink:#eceefe;--muted:#9a9fc4;--line:#2a2d4f;--accent:#6ea0ff;--accent-ink:#0e0f1f;--bad:#ff6b70}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 48px;display:flex;justify-content:center}
main{width:100%;max-width:720px}
h1{font-size:1.2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem}
.langs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
select,textarea,button{font:inherit;color:var(--ink)}
select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
#tukar{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card:focus-within{border-color:var(--accent)}
textarea{width:100%;min-height:120px;border:0;outline:0;resize:vertical;background:transparent;font-size:1.05rem;line-height:1.5}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;margin-top:6px}
#out{min-height:120px;font-size:1.05rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#out.ph{color:var(--muted)}
#out.err{color:var(--bad)}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.go{width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:1rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-bottom:12px}
.go:disabled{opacity:.6;cursor:wait}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Penerjemah Bahasa</h1>
  <p class="sub">Terjemahkan teks ke lebih dari 25 bahasa dunia.</p>

  <div class="langs">
    <select id="dari" aria-label="Dari bahasa"></select>
    <button id="tukar" title="Tukar bahasa" aria-label="Tukar bahasa">⇄</button>
    <select id="ke" aria-label="Ke bahasa"></select>
  </div>

  <div class="card">
    <textarea id="in" maxlength="500" placeholder="Ketik teks di sini..."></textarea>
    <div class="bar"><span id="cnt">0 / 500</span><button class="mini" id="hapus">Hapus</button></div>
  </div>

  <button class="go" id="go">Terjemahkan</button>

  <div class="card">
    <div id="out" class="ph">Hasil terjemahan muncul di sini.</div>
    <div class="bar"><span></span>
      <span><button class="mini" id="suara">🔊 Dengar</button> <button class="mini" id="salin">Salin</button></span>
    </div>
  </div>

  <p class="foot">Maksimal 500 karakter per terjemahan. Hasil mesin bisa kurang tepat untuk kalimat rumit.</p>
</main>

<script>
const BAHASA = [
  ["id","Indonesia"],["en","Inggris"],["ms","Melayu"],
  ["ar","Arab"],["zh-CN","Mandarin (Sederhana)"],["zh-TW","Mandarin (Tradisional)"],["ja","Jepang"],["ko","Korea"],
  ["hi","Hindi"],["bn","Bengali"],["ur","Urdu"],["fa","Persia"],["th","Thai"],["vi","Vietnam"],["tl","Filipino"],
  ["tr","Turki"],["he","Ibrani"],["ru","Rusia"],["uk","Ukraina"],["pl","Polandia"],
  ["de","Jerman"],["fr","Prancis"],["es","Spanyol"],["pt","Portugis"],["it","Italia"],["nl","Belanda"],["sv","Swedia"],["el","Yunani"],["sw","Swahili"]
];
const $ = id => document.getElementById(id);
const dari = $("dari"), ke = $("ke"), inp = $("in"), out = $("out"), go = $("go");

BAHASA.forEach(([k, n]) => {
  dari.add(new Option(n, k));
  ke.add(new Option(n, k));
});
dari.value = "id"; ke.value = "en";

let hasil = "";
function tampil(teks, kelas){
  out.textContent = teks;
  out.className = kelas || "";
}

async function terjemah(){
  const q = inp.value.trim();
  if (!q) { tampil("Ketik teks dulu ya.", "ph"); hasil = ""; return; }
  if (dari.value === ke.value) { hasil = q; tampil(q); return; }
  go.disabled = true; go.textContent = "Menerjemahkan...";
  try {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) +
                "&langpair=" + encodeURIComponent(dari.value + "|" + ke.value);
    const r = await fetch(url);
    const d = await r.json();
    const t = d && d.responseData && d.responseData.translatedText;
    if (!t || /MYMEMORY WARNING/i.test(t) || Number(d.responseStatus) !== 200) {
      const kuota = /MYMEMORY WARNING/i.test(t || "");
      throw new Error(kuota ? "Kuota terjemahan gratis hari ini habis. Coba lagi besok." : "Terjemahan gagal. Coba lagi sebentar lagi.");
    }
    hasil = t; tampil(t);
  } catch (e) {
    hasil = "";
    tampil(e.message && e.message.startsWith("Kuota") || e.message.startsWith("Terjemahan") ? e.message : "Tidak bisa terhubung. Cek koneksi internetmu.", "err");
  } finally {
    go.disabled = false; go.textContent = "Terjemahkan";
  }
}

go.onclick = terjemah;
inp.addEventListener("input", () => { $("cnt").textContent = inp.value.length + " / 500"; });
inp.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) terjemah(); });

$("tukar").onclick = () => {
  const a = dari.value; dari.value = ke.value; ke.value = a;
  if (hasil) { inp.value = hasil; $("cnt").textContent = inp.value.length + " / 500"; terjemah(); }
};

$("hapus").onclick = () => {
  inp.value = ""; hasil = ""; $("cnt").textContent = "0 / 500";
  tampil("Hasil terjemahan muncul di sini.", "ph"); inp.focus();
};

$("salin").onclick = async () => {
  if (!hasil) return;
  const b = $("salin");
  try { await navigator.clipboard.writeText(hasil); b.textContent = "Tersalin"; }
  catch (e) { b.textContent = "Gagal"; }
  setTimeout(() => b.textContent = "Salin", 1500);
};

$("suara").onclick = () => {
  if (!hasil || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(hasil);
  u.lang = ke.value;
  speechSynthesis.speak(u);
};
</script>
</body>
</html>
